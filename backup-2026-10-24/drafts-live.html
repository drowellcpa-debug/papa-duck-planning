<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Papa Duck Drafts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --ground:#F1F4F0; --surface:#FFFFFF; --sunk:#E7ECE6; --line:#CFD8CF; --ink:#16201A; --muted:#58645C;
  --accent:#1E5B43; --accent-ink:#FFFFFF; --accent-soft:#DCEBE2;
  --flag:#8A5200; --flag-bg:#FBEFD8; --danger:#A12A1E; --danger-bg:#FBE4E0; --ok:#1C7443; --ok-bg:#DDF1E4;
  --display:"Bitter", Georgia, "Times New Roman", serif;
  --body:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0F1411; --surface:#171F1A; --sunk:#1E2822; --line:#2E3A33; --ink:#E4EBE6; --muted:#9BA9A1;
    --accent:#6CC196; --accent-ink:#0C1A13; --accent-soft:#1D3528;
    --flag:#F0B866; --flag-bg:#382810; --danger:#FF8C7C; --danger-bg:#3C1B16; --ok:#7AD29E; --ok-bg:#16301F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0F1411; --surface:#171F1A; --sunk:#1E2822; --line:#2E3A33; --ink:#E4EBE6; --muted:#9BA9A1;
  --accent:#6CC196; --accent-ink:#0C1A13; --accent-soft:#1D3528;
  --flag:#F0B866; --flag-bg:#382810; --danger:#FF8C7C; --danger-bg:#3C1B16; --ok:#7AD29E; --ok-bg:#16301F;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:15px/1.5 var(--body);margin:0}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:14px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:1.45rem;letter-spacing:-.01em}
.brand .sub{color:var(--muted);font-size:.85rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:600;display:flex;gap:6px;align-items:center}
.tab .n{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-pressed="true"] .n{color:var(--accent-ink);opacity:.85}
.searchrow{display:flex;gap:8px;margin-top:10px}
.search{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;font-size:1rem}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0 14px;font-weight:600;font-size:.9rem}

/* notices */
.notice{border-radius:var(--r);padding:12px 14px;margin-top:14px;font-size:.92rem;line-height:1.45}
.notice.info{background:var(--accent-soft)}
.notice.warn{background:var(--flag-bg);color:var(--flag)}
.notice.bad{background:var(--danger-bg);color:var(--danger)}
.notice b{font-weight:700}
.notice .act{margin-top:8px}

/* list */
.scanhead{font-family:var(--display);font-size:1rem;margin:22px 0 8px;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline}
.scanhead .mono{font-size:.8rem}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;width:100%}
.row:hover{border-color:var(--accent)}
.pcol{display:flex;gap:8px;align-items:center}
.cov{width:44px;height:58px;border-radius:6px;background:var(--sunk);overflow:hidden;display:block;flex:0 0 44px}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.pbadge{min-width:48px;padding:0 6px;font-family:var(--mono);font-weight:600;font-size:1rem;background:var(--sunk);border-radius:8px;height:44px;display:grid;place-items:center}
.row .t{font-weight:600;line-height:1.3}
.row .m{color:var(--muted);font-size:.84rem;margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:.75rem;font-weight:700;letter-spacing:.02em;border-radius:999px;padding:3px 9px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.chip.q{background:var(--flag-bg);color:var(--flag)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.bad{background:var(--danger-bg);color:var(--danger)}
.chip.grade{background:var(--accent-soft);color:var(--accent)}
.chip.price{background:var(--ok-bg);color:var(--ok);font-family:var(--mono);font-size:.9rem;padding:3px 10px}
.chip.etsy{background:#F1641E;color:#fff}
.chip.amzok{background:#FFF3D6;color:#7A4B00;border:1px solid #E8A33D}.chip.amzgood{background:#E8F5E9;color:#1B5E20;border:1px solid #43A047}
.chip.amzno{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger)}.chip.amznone{background:#f1f1f1;color:#666;border:1px solid #ccc}
.amzbox{border:1px solid #E8A33D;border-radius:12px;padding:12px 14px;margin:12px 0;background:#FFFBF2}.amzbox h4{margin:0 0 6px}
.amzbox .amzseg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}.amzbox .amzseg button{border:1px solid #E8A33D;background:#fff;color:#7A4B00;border-radius:999px;padding:6px 12px;font-weight:600;cursor:pointer}
.amzbox .amzseg button.on{background:#E8A33D;color:#fff}
.amzbox table{border-collapse:collapse;width:100%;font-size:.92rem}.amzbox td{padding:3px 6px;border-bottom:1px dotted #e6d6b8}.amzbox td:first-child{color:#7A4B00;width:42%}
.chip.etsyrec{background:#FDEBDD;color:#A8430F;border:1px dashed #E07A3F}
.chip.etsyok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.ebadge{font-size:.8rem;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.ebadge.yes{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.ebadge.no{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger)}
.etsybox .et{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.etsybox .elock{display:inline-block;border:1px dashed var(--danger);color:var(--danger);background:var(--danger-bg);border-radius:999px;padding:7px 13px;font-weight:700;font-size:.9rem;cursor:not-allowed;user-select:none;pointer-events:none}
.etsybox{margin-top:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px;display:grid;gap:8px}
.etsybox.on{border-color:#F1641E;background:#FFF4EC}
.etsybox .eh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.etsybox .et{font-weight:700}
.etsybox .ew{font-size:.86rem;color:var(--muted)}
.etsybox .seg button[aria-pressed="true"].eon{background:#F1641E;border-color:#F1641E;color:#fff}
.chip.price.wait{background:var(--sunk);color:var(--muted);font-family:var(--body);font-size:.75rem}
.scanhead .runsum{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;justify-content:flex-end;font-family:var(--body);font-size:.84rem}
.scanhead .runsum .profit{font-family:var(--mono);font-weight:700;font-size:1.05rem;color:var(--ok);background:var(--ok-bg);border-radius:8px;padding:2px 9px}
.scanhead .runsum .dim{color:var(--muted)}
.scanhead > span:first-child{white-space:nowrap;margin-right:10px}
.empty{color:var(--muted);text-align:center;padding:40px 12px}

/* detail */
.back{border:0;background:none;color:var(--accent);font-weight:700;padding:14px 0 4px;font-size:.95rem}
.dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-top:6px}
.dhead h2{font-size:1.5rem;line-height:1.2}
.dhead .where{font-family:var(--mono);color:var(--muted);font-size:.85rem;margin-top:4px}
.bigpd{font-family:var(--mono);font-weight:600;font-size:1.05rem;background:var(--sunk);border-radius:8px;padding:6px 10px;white-space:nowrap}
.bigpd.qtybadge{background:var(--accent-soft);color:var(--accent)}
.photo{margin-top:14px;background:var(--sunk);border-radius:var(--r);height:min(62vh,640px);width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:.9rem;text-align:center;padding:8px}
.photo img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
.strip{display:flex;gap:8px;overflow-x:auto;padding-block:10px 4px}
.thumb{flex:0 0 64px;height:84px;border-radius:8px;border:2px solid var(--line);background:var(--sunk);overflow:hidden;display:grid;place-items:center;font-family:var(--mono);font-size:.75rem;color:var(--muted);padding:0;position:relative}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb[aria-current="true"]{border-color:var(--accent)}
.thumb .grp{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:.6rem;padding:1px 2px}
.photo{position:relative}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:64px;border:0;border-radius:10px;background:rgba(0,0,0,.45);color:#fff;font-size:2.2rem;line-height:1;display:grid;place-items:center;cursor:pointer}
.arrow.l{left:8px}.arrow.r{right:8px}
.arrow:hover{background:rgba(0,0,0,.65)}
.fullbtn{position:absolute;right:8px;bottom:8px;border:0;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;font-weight:700;font-size:.85rem;padding:7px 10px}
#bigimg{cursor:zoom-in}
.viewer{position:fixed;inset:0;z-index:20;background:#0b0d0c;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100vw;max-height:100vh;object-fit:contain}
.viewer img.zoom{max-width:none;max-height:none;cursor:zoom-out}
.viewer.zoomed{overflow:auto;display:block}
.viewer .arrow{position:fixed;width:56px;height:80px;font-size:2.8rem}
.viewer .close{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;border:0;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;font-weight:700;padding:10px 16px;font-size:1rem}
.viewer .count{position:fixed;left:12px;top:calc(16px + env(safe-area-inset-top,0px));color:#fff;font-family:var(--mono);font-size:.9rem}
.hint{color:var(--muted);font-size:.85rem;margin:-4px 0 4px}
.ihgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.ih{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:6px;display:grid;gap:6px}
.ih.on{border-color:var(--accent);background:var(--accent-soft)}
.ihbtn{border:0;background:none;text-align:left;font-weight:600;padding:4px 6px;border-radius:8px}
.ih input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--surface)}
.ihx{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.ihx input.ihpct{width:70px;font-family:var(--mono)}
.seg.small button{padding:5px 10px;font-size:.82rem}
.tellbox textarea{min-height:90px}
.notes{display:grid;gap:6px}
.note{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:8px 10px;display:grid;gap:6px}
.note .nt{font-size:.92rem}
.note.off{opacity:.6}
.note input.noteedit{width:100%;border:1px solid var(--accent);border-radius:8px;padding:8px}
.noteadd{display:flex;gap:8px;margin-top:8px}
.noteadd input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface)}
.pdmatch{font-size:.85rem;margin-top:4px;min-height:1.1em}
.removed{margin-top:10px}
.rmwrap{display:grid;gap:4px;justify-items:center}
.thumb.off{opacity:.45;cursor:default}
.photobar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 14px;font-weight:600;font-size:.92rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{padding:6px 10px;font-size:.84rem}
.sec{margin-top:22px}
.sec h3{font-size:1.05rem;margin-bottom:10px}
.label{display:block;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px}
.field textarea{min-height:120px;resize:vertical;line-height:1.45}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.q.need{border-color:var(--flag)}
.q .qt{font-weight:600}
.qlist{display:grid;gap:10px}
.price{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline}
.price .big{font-family:var(--mono);font-size:1.6rem;font-weight:700}
.price .sm{font-family:var(--mono);color:var(--muted)}
.range{font-size:.9rem;margin-top:6px}
.mkt{width:100%;border-collapse:collapse;margin:10px 0 4px;font-size:.88rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mkt th,.mkt td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.mkt th:first-child,.mkt td:first-child{text-align:left;font-weight:700}
.mkt td.nt{text-align:left;white-space:normal;color:var(--muted);font-size:.8rem}
.mkt thead th{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
.mkt tr:last-child td{border-bottom:0}
.mktwrap{overflow-x:auto}
.mono{font-family:var(--mono)}
.b1{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;font-size:.9rem}
.ttl{font-family:var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.88rem;overflow-wrap:anywhere}
.b2frame{width:100%;height:520px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.sub{margin-top:12px}
.sub summary{cursor:pointer;font-weight:600}
.pending{border:1px dashed var(--line);border-radius:var(--r);padding:12px;color:var(--muted);font-size:.9rem}
.wt{display:flex;align-items:center;gap:8px}
.wt input{width:90px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:9px;background:var(--surface);font-family:var(--mono);font-size:1.05rem}
.wt button{width:42px;height:42px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:1.1rem}
.pdin{display:flex;align-items:stretch;max-width:260px}
.pdin span{font-family:var(--mono);font-weight:600;background:var(--sunk);border:1px solid var(--line);border-right:0;border-radius:8px 0 0 8px;padding:9px 10px}
.pdin input{flex:1;min-width:0;border:1px solid var(--line);border-radius:0 8px 8px 0;padding:9px 10px;font-family:var(--mono);font-size:1.05rem;background:var(--surface)}
.check{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.check ul{margin:6px 0 12px;padding-left:18px;color:var(--flag)}
.check .ready{color:var(--ok);font-weight:700;margin:4px 0 12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.all summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:1.05rem;padding:4px 0}
.det{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 18px;margin-top:10px}
.det div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.det b{color:var(--muted);font-weight:600}
.det span{text-align:right;overflow-wrap:anywhere}
.plain{margin:4px 0 0;padding-left:20px;font-size:.9rem}
.plain.small{font-size:.8rem}
.seg .notlist{border-style:dashed;color:var(--muted)}
.confirm{margin-top:10px;background:var(--danger-bg);color:var(--danger);border-radius:var(--r);padding:12px;display:grid;gap:8px}

/* buyer view (2026-10-16, his ask: "the actual customer description I want to show on the right side of each book") */
.buyer{display:none}
@media (min-width:1200px){
  body.side .wrap{margin-left:24px;margin-right:0}
  body.side .buyer{display:flex;flex-direction:column;gap:10px;position:fixed;z-index:4;top:12px;bottom:12px;left:808px;right:140px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;overflow:auto;box-shadow:0 4px 14px rgba(0,0,0,.08)}
  body.side #b2det{display:none}
}
.buyer h3{font-size:1.05rem}
.buyer .bsub{color:var(--muted);font-size:.85rem}
.buyer .bprice{font-family:var(--mono);font-weight:700;font-size:1.3rem;color:var(--ok)}
.buyer iframe{flex:1 0 420px;width:100%;border:1px solid var(--line);border-radius:var(--r);background:#fff}
/* bottom bar */
.bar[hidden]{display:none!important}
body.nobar .wrap{padding-bottom:40px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:6}
.bar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar .txt{font-size:.9rem}
.bar .txt b{font-family:var(--mono)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:9;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: no-preference){ .row,.btn,.tab{transition:border-color .12s,background .12s} }
/* blast-off tally, pinned to the right on every screen until blast off clears it */
.tally{position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:7;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:96px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:grid;gap:6px}
.tally .th{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tally .tr{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:600;font-size:.88rem}
.tally .tr b{font-family:var(--mono);font-size:1.2rem;color:var(--accent)}
.tally .tr.etsy b{color:#E0611C}
.tally .tr.amz b{color:#B46A00}
.tally #fblast{margin-top:4px;white-space:nowrap}
.amzadd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.amzadd .small{font-size:.82rem;color:var(--muted)}
.amzadd .lbl{font-weight:700;font-size:.9rem}
.amzadd button[aria-pressed="true"].aon{background:#E8A33D;border-color:#E8A33D;color:#fff}
.amzadd .alock{display:inline-block;border:1px dashed var(--danger);color:var(--danger);background:var(--danger-bg);border-radius:999px;padding:7px 13px;font-weight:700;font-size:.9rem}

<script>
(function(){
"use strict";
const PROJECT = "gdwxwiwckxthwcsrgywh";
const SUPA = "Supabase", DRIVE = "Google Drive";
const GRADES = ["Like New","Very Good","Good","Acceptable"];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let mcp = null;
let drafts = [];
let tab = "check";
let view = { mode: "list", id: null };
let edits = {};          // per-draft unsaved edits
let photoCache = {};     // drive_id -> data URL | "error"
let selPhoto = 0;
let blastConfirm = false, fblastConfirm = false, notConfirm = null, allOpen = false;
let example = true;

// ---------- sample shown until your real drafts load ----------
const SAMPLE = [{
  id: -1, scan: "Example scan", p: "P1", p_num: 1, status: "drafted", is_set: false, photos: [],
  ident: { title: "Saxon Math 5/4 Student Edition (example)", author: "Stephen Hake", publisher: "Saxon Publishers", publication_year: "2004",
           isbn: "9781591413189", format: "Hardcover", edition_printing: "Third Edition", grade: "Good",
           condition_notes: ["Corners bumped, cover edges scuffed", "Light pencil in first 10 pages", "Binding tight"] },
  flags: [], questions: [{ q: "Is the answer key included?", options: ["Yes","No"] },
                         { q: "Anything the photos can't show?", options: ["None","Smoke / musty smell","Writing inside","Loose pages","Other"] }],
  answers: {}, pd: null, weight_lb: 3, error: null, price_stale: false,
  pricing: { list: 24.99, auto: 20, min: 16, avg: 24.71, low: 19.5, high: 29.99, n: 6, problems: [], checks_failed: [],
    ebay_title: "Saxon Math 5/4 Student Edition 3rd Ed Stephen Hake Hardcover Homeschool Math",
    b1: "Good as graded in hand. Corners bumped and cover edges scuffed. Light pencil in the first 10 pages; the rest is clean. Binding tight. A sound, usable copy.",
    b2: "<div style=\"font-family:Georgia,serif;padding:8px\"><h2 style=\"color:#1E5B43\">📘 Saxon Math 5/4 (example)</h2><p>This is where the full buyer description appears.</p></div>",
    note: "Example only.", used: [{ price: 24.99, title: "Saxon Math 5/4 Student Edition 3rd Ed (example)", cond: "Good", url: "" }], dropped: [], outliers: [] }
}];

// ---------- connector plumbing ----------
function sqlRows(result){
  // The Supabase tool can hand back a string, an object like {result:"..."}, or content blocks.
  let t = result && result.payload;
  if (t && typeof t === "object") {
    if (Array.isArray(t)) return t;
    t = (typeof t.result === "string" && t.result) || (typeof t.text === "string" && t.text) ||
        (Array.isArray(t.content) && t.content.filter((b) => b && b.type === "text").map((b) => b.text).join("\n")) || JSON.stringify(t);
  }
  if (!t) t = ((result && result.content) || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
  const m = /<untrusted-data-[^>]+>\s*([\s\S]*?)\s*<\/untrusted-data/.exec(t);
  let body = m ? m[1] : t;
  body = body.slice(body.indexOf("["));
  try { return JSON.parse(body); } catch (e) {
    // text that was escaped one level too many (\" instead of ")
    const fixed = body.slice(0, body.lastIndexOf("]") + 1).replace(/\\"/g, '"').replace(/\\\\/g, "\\");
    return JSON.parse(fixed);
  }
}
function dbMessage(e){
  const msg = String((e && e.message) || e || "");
  const m = /ERROR:\s+\w+:\s+([\s\S]*?)(\nCONTEXT:|\n|$)/.exec(msg);
  return m ? m[1].trim() : msg;
}
function explain(e, server){
  const code = e && e.code;
  if (code === "server_not_connected" || code === "selection_required")
    return { kind: "bad", text: "<b>" + server + " isn't connected for this page.</b> Add or pick " + server + " in claude.ai Settings → Connectors, then press Refresh." };
  if (code === "needs_reauth")
    return { kind: "bad", text: "<b>" + server + " needs to be reconnected.</b> Reconnect it in claude.ai Settings → Connectors, then press Refresh." };
  if (code === "not_in_manifest")
    return { kind: "bad", text: "<b>" + server + " is turned off for this page.</b> Allow it when the page asks, or turn it back on in this page's connector settings." };
  if (code === "blocked_by_policy" || code === "approval_required")
    return { kind: "bad", text: "<b>" + server + " is blocked here by your organization's settings.</b>" };
  if (code === "server_unavailable" || code === "upstream_error" || code === "rate_limited")
    return { kind: "warn", text: "<b>" + server + " didn't answer just now.</b> Wait a moment and press Refresh.", retry: true };
  if (code === "tool_error") return { kind: "bad", text: esc(dbMessage(e)) };
  if (code === "not_granted" || code === "capability_disabled" || code === "capability_removed")
    return { kind: "bad", text: "<b>This view can't reach your connectors.</b> Open the page in the Claude app or at claude.ai while signed in." };
  return { kind: "warn", text: esc(dbMessage(e)) };
}
async function sql(query){
  const r = await mcp.callTool(SUPA, "execute_sql", { project_id: PROJECT, query }, { cache: false });
  return sqlRows(r);
}
function jsonLit(obj){
  const s = JSON.stringify(obj);
  let tag;
  do { tag = "pd" + Math.random().toString(36).slice(2, 10); } while (s.indexOf(tag) !== -1);
  return "$" + tag + "$" + s + "$" + tag + "$::jsonb";
}

// ---------- data ----------
async function load(quiet){
  if (!mcp) return;
  if (!quiet) setStatus("Loading…");
  try {
    const rows = await sql("select pipeline.ui_list() as data, pipeline.fba_list() as fba");
    drafts = (rows[0] && rows[0].data) || [];
    reapplyArchived();
    if (rows[0] && rows[0].fba) fba = rows[0].fba;
    example = false;
    setNotice(null);
    setStatus("Updated " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }));
    render();
  } catch (e) {
    const x = explain(e, SUPA);
    setNotice(x.kind, x.text);
    setStatus("Not connected");
  }
}
async function save(id, patch){
  const rows = await sql("select pipeline.ui_save(" + Number(id) + ", " + jsonLit(patch) + ") as r");
  return rows[0] && rows[0].r;
}

// ---------- helpers ----------
function bucket(d){
  if (d.status === "fba") return "fba";            // Amazon FBA only - its own tab, never in blast off
  if (d.archived_at || (d.status === "sent" && d.built_at)) return "archive";   // cleared at blast off - fresh start each day
  if (d.status === "sent") return "sent";
  if (d.status === "dont_list") return "dont";
  if (d.status === "failed" || d.status === "processing") return "problem";
  return d.source === "station" ? "station" : "check";
}
function merged(d){
  const e = edits[d.id] || {};
  return {
    ident: Object.assign({}, d.ident || {}, e.ident || {}),
    answers: Object.assign({}, d.answers || {}, e.answers || {}),
    pd: e.pd !== undefined ? e.pd : (d.pd || ""),
    weight_lb: e.weight_lb !== undefined ? e.weight_lb : (d.weight_lb == null ? "" : d.weight_lb),
    channel: e.channel || d.channel || "both",
    location: e.location || d.location || "Garage",
    photos: e.photo_order ? e.photo_order.map((id) => (d.photos || []).find((p) => p.drive_id === id)).filter(Boolean) : (d.photos || []).filter((p) => !p.removed),
    removed: (d.photos || []).filter((p) => e.photo_order ? e.photo_order.indexOf(p.drive_id) === -1 : p.removed)
  };
}
const STANDING_Q = "Anything the photos can't show?";
const isStd = (q) => q && q.q === STANDING_Q;   // covered by the in-hand checklist now
function pdMatchText(d){
  const a = normPd(merged(d).pd), b = normPd((edits[d.id] || {}).pd2 || "");
  if (!b) return "";
  return a === b ? '<span style="color:var(--ok);font-weight:700">✓ Numbers match</span>' : '<span style="color:var(--danger);font-weight:700">✗ Doesn’t match — check the label</span>';
}
// ---------- family-friendly check (2026-10-07, his ask: "nudity or things that would not fly with my audience") ----------
function audOf(d){ return (d.ident || {}).audience || null; }
function audNeedsOk(d){ const a = audOf(d); return !!(a && a.ok === false && ((d.answers || {}).audience_ok || "") !== "yes"); }
/* v46 (2026-10-24, his ask: "also to the right of the listing before I click the book"): the flag chip says WHAT the issue is */
function audChip(d){
  const n = String((audOf(d) || {}).note || "").replace(/\s+/g, " ").trim();
  const short = n.length > 70 ? n.slice(0, 68).replace(/\s+\S*$/, "") + "…" : n;
  return '<span class="chip aud audwhy" title="' + esc(n) + '">⚠️ ' + esc(short || "Family check") + "</span>";
}
function audHtml(d, locked){
  const a = audOf(d);
  if (!a) return '<div class="audbox wait">⏳ Family-friendly check is running — about a minute.</div>';
  if (a.ok) return '<div class="audbox pass">✓ Family-friendly check: no concerns.</div>';
  const okd = ((d.answers || {}).audience_ok || "") === "yes";
  return '<div class="audbox ' + (okd ? "okd" : "flag") + '"><div><b>⚠️ Family-friendly check' + (a.level === "caution" ? " (caution)" : "") + ':</b> ' + esc(a.note || "") + "</div>" +
    (okd ? '<div>You said <b>OK to list</b>.' + (locked ? "" : ' <button class="btn small" type="button" id="audundo">Undo</button>') + "</div>"
         : (locked ? "" : '<div class="actions"><button class="btn primary" type="button" id="audok">OK to list</button><button class="btn danger notlist" type="button" data-not="dont_list">Don\'t list</button></div>')) + "</div>";
}
async function setAudOk(d, v){
  if (example){ toast("This is the example card. Nothing is saved."); return; }
  try { await save(d.id, { action: "save", audience_ok: v }); await load(true); toast(v ? "OK to list — noted." : "Back to flagged.");
    if (view.mode === "detail" && current()) renderDetail(current()); }
  catch (err){ const x = explain(err, SUPA); setNotice(x.kind, x.text); window.scrollTo(0, 0); }
}
function missingFor(d){
  const m = merged(d), out = [];
  if (!audOf(d)) out.push("Family-friendly check (runs on its own, about a minute)");
  else if (audNeedsOk(d)) out.push("Your OK on the ⚠️ family-friendly flag (OK to list, or Don't list)");
  const pd = normPd(m.pd);
  if (!/^PD-\d{4}[A-Z]?$/.test(pd)) out.push("PD number");
  else if (d.status === "drafted" && normPd((edits[d.id] || {}).pd2 || "") !== pd) out.push((edits[d.id] || {}).pd2 ? "The two PD numbers don't match — check the label" : "Type the PD number a second time to confirm");
  if (!(Number(m.weight_lb) > 0)) out.push("Weight");
  const ov = (edits[d.id] || {}).price_override !== undefined ? (edits[d.id] || {}).price_override : d.price_override;
  if (!(Number(ov) > 0) && !(d.pricing && d.pricing.list)) out.push(d.pricing && d.pricing.error ? "Your price (no matching copies found)" : "Price (still being worked out)");
  (d.questions || []).forEach((q, i) => { if (!isStd(q) && !String(m.answers[i] || "").trim()) out.push("Answer: " + q.q); });
  return out;
}
function normPd(v){
  let s = String(v || "").toUpperCase().replace(/\s+/g, "");
  if (/^\d{3,4}[A-Z]?$/.test(s)) { const L = (s.match(/[A-Z]$/) || [""])[0]; s = "PD-" + s.replace(/[A-Z]$/, "").padStart(4, "0") + L; }
  if (/^PD\d/.test(s)) s = "PD-" + s.slice(2);
  return s;
}
function matches(d, q){
  if (!q) return true;
  const id = d.ident || {};
  const hay = [d.p, d.pd, d.scan, id.title, id.author, id.isbn, id.subtitle_or_series].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every((w) =>
    hay.indexOf(w) !== -1 || w === "p" + d.p_num || w === String(d.p_num) || (d.pd && normPd(w) === d.pd));
}
function setStatus(t){ $("status").textContent = t; }
function setNotice(kind, html){
  $("notices").innerHTML = kind ? '<div class="notice ' + kind + '">' + html + "</div>" : "";
}
let toastT = null;
function toast(t){
  const el = $("toast"); el.textContent = t; el.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 3200);
}
function list(){ return example ? SAMPLE : drafts; }
function current(){ return list().find((d) => d.id === view.id); }

// ---------- render ----------
function render(){
  const all = list();
  const counts = { check: 0, station: 0, sent: 0, fba: 0, dont: 0, problem: 0, archive: 0 };
  all.forEach((d) => counts[bucket(d)]++);
  Object.keys(counts).forEach((k) => { $("n-" + k).textContent = counts[k]; });
  document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-pressed", b.dataset.tab === tab ? "true" : "false"));
  const waiting = all.filter((d) => d.status === "sent" && !d.built_at).length;
  $("bartxt").innerHTML = blastConfirm
    ? "Send <b>" + waiting + "</b> book" + (waiting === 1 ? "" : "s") + " to blast off?"
    : "<b>" + waiting + "</b> sent, waiting for blast off";
  $("blast").textContent = blastConfirm ? "Yes, blast off" : "Blast off";
  $("blast").disabled = example || (!blastConfirm && waiting === 0);
  // 2026-10-09 his ask: "I want a separate blast for amazon FBA I will get these out before my others"
  const fw = fbaWaiting();
  $("fblast").hidden = example || (fw.go.length + fw.held.length === 0 && !fblastConfirm);
  $("fblast").textContent = fblastConfirm ? "Yes, send " + fw.go.length + " to Amazon" : "🚀 Blast off FBA only";
  if (view.mode === "detail" && current()) renderDetail(current()); else renderList();
  $("bar").hidden = !(view.mode === "list" && (tab === "check" || tab === "station"));   // blast off only on the To check list, never while reviewing a book
  document.body.classList.toggle("nobar", $("bar").hidden);
  updateTally();
}
// books sent and waiting for blast off, by where they're going. Blast off sets built_at, so the counts clear on their own.
function updateTally(){
  const waiting = list().filter((d) => d.status === "sent" && !d.built_at && !d.archived_at);
  const n = { ebay: 0, abe: 0, etsy: 0, amz: 0, fba: 0 };
  waiting.forEach((d) => {
    const c = d.channel || "both";
    if (c === "both" || c === "ebay") n.ebay++;
    if (c === "both" || c === "abe") n.abe++;
    if (d.etsy) n.etsy++;
    if (c === "fba") n.fba++;
    else if (c === "amazon" || amzWill(d)) n.amz++;
  });
  $("t-ebay").textContent = n.ebay; $("t-abe").textContent = n.abe; $("t-etsy").textContent = n.etsy; $("t-amz").textContent = n.amz; $("t-fba").textContent = n.fba;
}

function renderList(){
  view = { mode: "list", id: null };
  buyerShow(null);
  if (tab === "fba") { renderFbaTab(); return; }
  const q = $("search").value.trim();
  const items = list().filter((d) => bucket(d) === tab && matches(d, q));
  if (example) setNotice("info", "<b>This is an example card.</b> Your real drafts appear here as soon as the page connects to Supabase.");
  if (!items.length) {
    const msg = { check: "Nothing to check right now. Fill a P folder in PapaDuck Inbox and its draft shows up here a few minutes later.",
                  station: "Nothing from the Book Station yet. Upload a book there and press 📤 Send to Drafts — it shows up here.",
                  sent: "No books sent yet.", dont: "Nothing set aside for Goodwill, trash or Don't list.", problem: "No problems.", archive: "Nothing archived yet. Blast off moves listed, Not listing and Problem books here." }[tab];

function money(v){ return "$" + Number(v).toFixed(2); }
function marketHtml(pr){

}

// Drive's download tool may answer in several shapes; hunt for the base64 image wherever it is.
function findImage(x, depth){
  depth = depth || 0;
  const out = { b64: "", mt: "" };
  if (x == null || depth > 6) return out;
  if (typeof x === "string") {
    const t = x.trim();
    if ((t[0] === "{" || t[0] === "[") && t.length < 40000000) { try { return findImage(JSON.parse(t), depth + 1); } catch (_) {} }
    const d = /^data:([^;]+);base64,(.+)$/s.exec(t);
    if (d) return { b64: d[2], mt: d[1] };
    if (t.length > 800 && /^[A-Za-z0-9+/_=\r\n-]+$/.test(t.slice(0, 400))) return { b64: t.replace(/\s+/g, "").replace(/-/g, "+").replace(/_/g, "/"), mt: "" };
    return out;
  }
  if (Array.isArray(x)) { for (const v of x) { const f = findImage(v, depth + 1); if (f.b64) return f; } return out; }
  if (typeof x === "object") {
    const mt = x.mimeType || x.mime_type || x.media_type || "";
    for (const k of ["content", "base64Content", "data", "blob", "bytes", "payload", "result", "text", "resource", "source"]) {
      if (k in x) { const f = findImage(x[k], depth + 1); if (f.b64) return { b64: f.b64, mt: f.mt || mt }; }
    }
    for (const k in x) { const f = findImage(x[k], depth + 1); if (f.b64) return { b64: f.b64, mt: f.mt || mt }; }
  }
  return out;
}
async function loadPhoto(p, quiet){
  if (!p || !mcp || photoCache[p.drive_id]) return;
  const pid = String(p.drive_id || "");
  if (pid.indexOf("none:") === 0) { photoCache[pid] = "error"; return; }
  if (pid.indexOf("blob:") === 0) {   // Book Station photo — a copy is kept in the database for this page
    try {
      const key = pid.slice(5).replace(/[^A-Za-z0-9_.-]/g, "");
      const r = await mcp.callTool(SUPA, "execute_sql", { project_id: PROJECT, query: "select mime, b64 from pipeline.photo_blobs where key = '" + key + "'" },
        { cache: { staleTime: 3600000, gcTime: 86400000 } });
      const row = sqlRows(r)[0];
      if (!row || !row.b64) throw new Error("no image data");
      photoCache[pid] = "data:" + (row.mime || "image/jpeg") + ";base64," + row.b64;
    } catch (e) { photoCache[pid] = "error"; }
    if (!quiet && view.mode === "detail" && current()) renderDetail(current());
    return;
  }
  try {
    const r = await mcp.callTool(DRIVE, "download_file_content", { fileId: p.drive_id }, { cache: { staleTime: 300000, gcTime: 86400000 } });
    const found = findImage(r);
    const b64 = found.b64, mt = found.mt || "image/jpeg";
    if (!b64) throw new Error("no image data");
    photoCache[p.drive_id] = "data:" + mt + ";base64," + b64;
  } catch (e) {
    photoCache[p.drive_id] = "error";
    if (!quiet && e && e.code && e.code !== "tool_error"){ const x = explain(e, DRIVE); setNotice(x.kind, x.text); }
  }
  if (!quiet && view.mode === "detail" && current()) renderDetail(current());
}

function fbaState(it){
  const t = (v) => v ? new Date(v).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
  if (it.status === "queued" || it.status === "listing") return ["wait", "⏳ Listing it on Amazon (FBA)…"];
  if (it.status === "waiting_fnsku") return ["wait", "⏳ Amazon is making the sticker number… (usually a minute or two)"];
  if (it.status === "removing") return ["wait", "↩️ Taking it off Amazon…"];
  if (it.status === "error") return ["bad", "❌ " + (it.error || "Problem")];
  if (it.status === "ready") {
    const pending = !it.printed_at || (it.print_requested_at && new Date(it.printed_at) < new Date(it.print_requested_at));
    if (!it.printed_at && !it.print_requested_at) return ["ok", "🏷 Sticker ready — print it in Dispatch → 📦 FBA → Ready to print" + (it.print_error ? " (last try: " + it.print_error + ")" : "")];

  if (rows[0] && rows[0].fba) fba = rows[0].fba;
  const now = (fba.items || []).map((it) => it.id);
  if (before.some((id) => now.indexOf(id) === -1)) await load(true);   // an Undo finished: the book is back in To check
  else repaintFba();
}
// while a sticker is on its way, look every 5 seconds; otherwise once a minute
let fbaFast = 0;
setInterval(async () => {
  if (!mcp || example || document.hidden || autoBusy) return;
  const busy = (fba.items || []).some((it) => ["queued", "listing", "waiting_fnsku", "removing"].includes(it.status) ||
    (it.status === "ready" && (!it.printed_at || new Date(it.printed_at) < new Date(it.print_requested_at))));
  if (!busy && Date.now() - fbaFast > 90000 && !(view.mode === "list" && tab === "fba")) return;
  try { await fbaRefresh(); } catch (_) {}
}, 5000);

// ---------- FBA blast off (2026-10-09): sends ONLY the FBA books to Amazon; eBay / Abe / Etsy wait for the normal Blast off ----------
function fbaWaiting(){
  const w = list().filter((d) => d.status === "sent" && !d.built_at && !d.archived_at && (d.channel || "") === "fba");
  return { go: w.filter((d) => !audNeedsOk(d)), held: w.filter((d) => audNeedsOk(d)) };
}
function fbaWaitHtml(){
  const fw = fbaWaiting();
  if (!fw.go.length && !fw.held.length) return "";
  return '<div class="just"><h3>📦 Sent to FBA, waiting to go</h3>' +
    (fw.go.length ? '<div class="fw" style="font-size:.9rem">' + fw.go.map((d) => '<span class="mono">' + esc(d.pd || "") + "</span> " + esc(((d.ident || {}).title || "").slice(0, 50))).join("<br>") + "</div>" : "") +
    (fw.held.length ? '<div style="color:var(--flag);margin-top:6px"><b>⚠️ Needs your OK on the family check first:</b> ' + fw.held.map((d) => esc(d.pd || "")).join(", ") + "</div>" : "") +
    (fw.go.length ? '<div class="actions" style="margin-top:10px"><button class="btn fbabtn" type="button" id="fblast2">' + (fblastConfirm ? "Yes, send " + fw.go.length + " to Amazon" : "🚀 Blast off FBA only (" + fw.go.length + ")") + "</button></div>" : "") + "</div>";
}
async function fbaBlast(){
  const fw = fbaWaiting();
  if (!fw.go.length){ fblastConfirm = false; setNotice("warn", "<b>⚠️ Your FBA book" + (fw.held.length === 1 ? " needs" : "s need") + " your OK on the family check first:</b> " + fw.held.map((d) => esc(d.pd || "")).join(", ") + " — open it in Sent and press OK to list or Don't list."); window.scrollTo(0, 0); render(); return; }
  if (!fblastConfirm){ fblastConfirm = true; render(); setTimeout(() => { if (fblastConfirm){ fblastConfirm = false; render(); } }, 8000); return; }
  fblastConfirm = false;
  try {
    const rows = await sql("select pipeline.fba_from_blastoff() as r");
    const r = (rows[0] && rows[0].r) || {};
    await load(true); try { await fbaRefresh(); } catch (_) {}
    setNotice(r.fba ? "info" : "warn", (r.fba ? "<b>📦 " + r.fba + " book" + (r.fba === 1 ? "" : "s") + " sent to Amazon FBA</b> (box " + esc(r.box) + ") — the stickers show up in <b>Dispatch → 📦 FBA → Ready to print</b> in a few minutes to an hour. Your eBay and Abe books are still waiting for the normal Blast off." +
        '<div class="act mono">' + esc(r.fba_pds || "") + "</div>" : "<b>No FBA books went out.</b>") +
      (r.fba_problems && r.fba_problems.length ? '<div class="act" style="color:var(--danger)"><b>Not sent (still in Sent):</b><br>' + r.fba_problems.map(esc).join("<br>") + "</div>" : ""));
    window.scrollTo(0, 0);
  } catch (e){ const x = explain(e, SUPA); setNotice(x.kind, x.text); render(); }
}
$("fblast").onclick = fbaBlast;
document.addEventListener("click", (e) => { if (e.target && e.target.id === "fblast2") fbaBlast(); });

// ---------- blast off ----------
$("blast").onclick = async () => {
  if (!blastConfirm){ blastConfirm = true; render(); setTimeout(() => { if (blastConfirm){ blastConfirm = false; render(); } }, 8000); return; }
  blastConfirm = false;
  try {
    const rows = await sql("select pipeline.ui_blastoff() as r");
    const r = rows[0] && rows[0].r;
    setNotice("info", "<b>Ready for blast off: " + (r ? r.waiting : 0) + " book" + (r && r.waiting === 1 ? "" : "s") + ".</b> Now say “blast off” to Claude in the chat, then list them in Dispatch as usual." + (r && r.archived ? " " + r.archived + " finished book" + (r.archived === 1 ? "" : "s") + " moved to Archive." : "") +
      (r && r.pds ? '<div class="act mono">' + esc(r.pds) + "</div>" : "") +
      (r && r.fba ? '<div class="act"><b>📦 ' + r.fba + " book" + (r.fba === 1 ? "" : "s") + " going to Amazon FBA</b> (box " + esc(r.box) + ") — their stickers show up in <b>Dispatch → 📦 FBA → Ready to print</b> in a minute or two: " + '<span class="mono">' + esc(r.fba_pds) + "</span></div>" : "") +
      (r && r.audience_hold && r.audience_hold.length ? '<div class="act" style="color:var(--flag)"><b>⚠️ Family-friendly flag not cleared yet:</b> ' + r.audience_hold.map(esc).join(", ") + " — open each one and press OK to list or Don't list before the files are built.</div>" : "") +
      (r && r.fba_problems && r.fba_problems.length ? '<div class="act" style="color:var(--danger)"><b>Not sent to FBA (still in Sent):</b><br>' + r.fba_problems.map(esc).join("<br>") + "</div>" : ""));
    window.scrollTo(0, 0);
    render();
  } catch (e){ const x = explain(e, SUPA); setNotice(x.kind, x.text); render(); }
};

// ---------- auto refresh (prices arrive in the background) ----------
setInterval(() => {
  if (!mcp || example || document.hidden) return;
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA)$/.test(a.tagName)) return;
  if (Object.values(edits).some((e) => Object.keys(e || {}).some((k) => k !== "pd" && k !== "pd2"))) return;   // unsaved changes (PD typing doesn't block updates)
  const waiting = drafts.some((d) => (d.price_stale && d.status !== "dont_list" && !d.built_at) || d.status === "processing");
  if (waiting || view.mode === "list") load(true);
}, 40000);

// ---------- wiring ----------
document.querySelectorAll(".tab").forEach((b) => b.onclick = () => { tab = b.dataset.tab; view = { mode: "list", id: null }; render(); if (tab === "station" || tab === "check") repriceMissing(); });
// Any book with no price gets re-priced the moment he looks at it, and the cloud is kicked right away (2026-09-30)
let repriceAt = 0;
async function repriceMissing(force){
  if (!mcp || example) return;
  if (!force && Date.now() - repriceAt < 45000) return;
  const need = drafts.some((d) => (d.status === "drafted" || d.status === "sent") && !d.built_at && !d.archived_at && priceOf(d) == null);
  if (!need) return;
  repriceAt = Date.now();
  try {
    const rows = await sql("select pipeline.ui_reprice_missing() as r");
    const r = rows[0] && rows[0].r;
    if (r && r.pricing) toast("Pricing " + r.pricing + " book" + (r.pricing === 1 ? "" : "s") + " now — about a minute.");
    setTimeout(() => load(true), 60000); setTimeout(() => load(true), 110000);
  } catch (e) { /* the once-a-minute cloud run still catches it */ }
}
$("search").addEventListener("input", () => {
  const q = $("search").value.trim();
  if (view.mode === "detail") view = { mode: "list", id: null };
  const hit = q && list().filter((d) => matches(d, q));
  if (hit && hit.length === 1 && /^(p?\d+|pd-?\d+)$/i.test(q) && bucket(hit[0]) !== tab) tab = bucket(hit[0]);
  render();
});
$("refresh").onclick = () => load();
document.addEventListener("visibilitychange", () => { if (!document.hidden && view.mode === "list") load(true); });

render();
(async () => {
  try { mcp = await window.claude.use("mcp"); } catch (_) { mcp = null; }
  if (!mcp){ setStatus("Not connected"); setNotice("warn", "<b>This view can't reach your connectors.</b> Open the page in the Claude app or at claude.ai while signed in. Until then you're looking at an example card."); return; }
  load();
})();
})();
</script>
