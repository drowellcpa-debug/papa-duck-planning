<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E5B43">
<title>Papa Duck Sorting Helper</title>
<!-- 2026-11-12 Papa Duck: "If I had my daughter and wife sort ahead of me that would be super helpful" + pre-printed PD stickers.
     One big scan box. The answer is a big color + the box to drop the book in. LIST books get the next sticker (number remembered,
     +1 each time, so on a roll in order they just press Enter). Uses station-api (same passcode as the Book Station). -->
<style>
:root{--ink:#14201a;--muted:#5d6b63;--bg:#f4f6f3;--card:#fff;--line:#d9e0db;--brand:#1E5B43;
  --list:#1f8a4c;--vinted:#7b3fa0;--sell:#1f6fb8;--goodwill:#6b7570;--toss:#c0392b;--ask:#c98a00}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column}
header{background:var(--brand);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:1.15rem;margin:0}
header .tally{font-size:.85rem;opacity:.9;text-align:right}
main{flex:1;padding:16px;max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.scan{display:flex;gap:8px}
.scan input{flex:1;min-width:0;font-size:1.4rem;padding:14px;border:3px solid var(--line);border-radius:12px;background:#fff}
.scan input:focus{outline:none;border-color:var(--brand)}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:14px 18px;cursor:pointer;min-height:56px}
.cam{background:#fff;border:3px solid var(--line);font-size:1.5rem;padding:0 18px}
.go{background:var(--brand);color:#fff}
.hint{color:var(--muted);font-size:.9rem;text-align:center;margin:0}
#out{flex:1;display:flex;flex-direction:column}
.res{border-radius:18px;color:#fff;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.res .bin{font-size:2.6rem;font-weight:900;line-height:1.05;letter-spacing:.5px}
.res .what{font-size:1.15rem;font-weight:700}
.res .title{font-size:.95rem;opacity:.9;max-width:100%;overflow-wrap:anywhere}
.res .big{font-size:3rem;font-weight:900;background:#fff3b0;color:#4a2a63;border:3px dashed #4a2a63;border-radius:10px;padding:2px 18px}
.LIST{background:var(--list)} .VINTED{background:var(--vinted)} .SELL{background:var(--sell)} .GOODWILL{background:var(--goodwill)}
.TOSS{background:var(--toss)} .ASK{background:var(--ask)} .RETAKE{background:#fff;color:var(--ink);border:3px solid var(--ask)}
.stk{display:flex;gap:8px;width:100%;max-width:420px}
.stk input{flex:1;min-width:0;font-size:1.6rem;font-weight:800;padding:12px;border-radius:12px;border:0;text-align:center}
.stk button{background:#fff;color:var(--list)}
.skip{background:transparent;color:#fff;text-decoration:underline;font-weight:600;min-height:36px;padding:4px}
.err{color:#ffe7e3;font-weight:800}
.busy{display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 0;color:var(--muted);font-weight:700}
.spin{width:54px;height:54px;border-radius:50%;border:6px solid var(--line);border-top-color:var(--brand);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pass{background:var(--card);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.pass input{font-size:1.3rem;padding:12px;border:2px solid var(--line);border-radius:10px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:.85rem}
.recent{background:var(--card);border-radius:14px;padding:10px 12px;margin-top:6px}
.recent h2{font-size:.95rem;margin:2px 0 6px}
.rrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}
.rrow .dot{font-size:1.1rem}
.rrow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .pd{font-weight:800}
.rrow button{min-height:40px;padding:6px 10px;background:#fff;border:2px solid var(--line);font-size:.85rem}
.legend span{border-radius:8px;color:#fff;padding:6px 8px;font-weight:700}
.binbar{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:8px 10px}
.binbar .lbl{flex:1;font-weight:800;font-size:1.05rem}
.binbar .lbl small{display:block;font-weight:600;color:var(--muted);font-size:.85rem}
.binbar button{min-height:48px;min-width:48px;padding:6px 12px;background:#fff;border:2px solid var(--line);font-size:1.2rem}
.binbig{font-size:2.4rem;font-weight:900;background:#fff;color:var(--list);border-radius:12px;padding:2px 18px}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<header><h1>🦆 Sorting Helper</h1><div class="tally" id="tally"></div></header>
<main id="app"></main>
<input type="file" id="file" accept="image/*" capture="environment" hidden>
<script>
const API_URL = 'https://gdwxwiwckxthwcsrgywh.supabase.co/functions/v1/station-api';
const PASS_KEY = 'pdStationPass', STK_KEY = 'pdSortNextSticker', TALLY_KEY = 'pdSortTally', RECENT_KEY = 'pdSortRecent', BIN_KEY = 'pdSortBin';
// 2026-11-12 Papa Duck: "from now on ... add Bin#" - each bin holds 15-20 books, so books are found by bin, not PD order.
let binNo = Number(ls0('pdSortBin')) || 0, binN = null, binCap = 18;
// "it can not be reused once selected": each bin is checked out to one sorter - the page asks who is sorting once per phone
let WHO = (ls0('pdSortWho') || '').replace(/^sort-.*/, '');
// 2026-11-13 per-person PINs: the PIN typed at sign-in says who is sorting (server maps PIN -> name)
async function askWho(){ try { const r = await api('whoami'); WHO = String(r.who || 'sorter'); } catch(e){ WHO = 'sorter'; }
  try { localStorage.setItem('pdSortWho', WHO); } catch(e){} }
function ls0(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
const $ = (id) => document.getElementById(id);
const esc = (x) => String(x == null ? '' : x).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ls = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };
let cur = null, tally = {};
// 2026-11-12 Papa Duck: "if they mess up on a sticker does it give them the ability to see what they scanned in last and fix it?"
let recent = []; try { recent = JSON.parse(ls.get(RECENT_KEY) || '[]'); } catch(e){ recent = []; }
function remember(bin, title, pd, box){ if (!cur) return; recent = [{ id: cur.pile_id, bin, title: title || '', pd: pd || '', box: box || null }].concat(recent.filter((r) => r.id !== cur.pile_id)).slice(0, 15); ls.set(RECENT_KEY, JSON.stringify(recent)); }
const DOT = { LIST: '🟢', VINTED: '🟣', SELL: '🔵', GOODWILL: '⚪', TOSS: '🔴', ASK: '🟡' };
function recentHtml(){
  if (!recent.length) return '';
  return `<div class="recent"><h2>Last books sorted</h2>` + recent.slice(0, 10).map((r, i) => `<div class="rrow"><span class="dot">${DOT[r.bin] || '•'}</span>
    <span class="t">${r.pd ? `<span class="pd">${esc(r.pd)}</span> · ` : ''}${r.box ? `<b>Bin ${esc(r.box)}</b> · ` : ''}${esc(r.title || '(no title)')}</span>
    ${r.bin === 'LIST' && r.id ? `<button data-fix="${i}">✏️ ${r.pd ? 'Fix sticker' : 'Add sticker'}</button>` : ''}</div>`).join('') + `</div>`;
}
try { tally = JSON.parse(ls.get(TALLY_KEY) || '{}'); if (tally.day !== new Date().toDateString()) tally = { day: new Date().toDateString() }; } catch(e){ tally = { day: new Date().toDateString() }; }

async function api(action, body){
  const r = await fetch(API_URL, { method: 'POST', headers: { 'content-type': 'application/json', 'x-station-pass': ls.get(PASS_KEY) || '' }, body: JSON.stringify(Object.assign({ action }, body || {})) });
  let j = null; try { j = await r.json(); } catch(e){}
  if (j && j.ok) return j;
  const e = new Error((j && j.error) || ('The cloud answered ' + r.status)); e.code = j && j.error; throw e;
}
function count(bin){ tally[bin] = (tally[bin] || 0) + 1; ls.set(TALLY_KEY, JSON.stringify(tally)); showTally(); }
function showTally(){
  const n = (k) => tally[k] || 0, total = ['LIST','VINTED','SELL','GOODWILL','TOSS','ASK'].reduce((a, k) => a + n(k), 0);
  $('tally').innerHTML = total ? `Today: <b>${total}</b> sorted<br>🟢 ${n('LIST')} · 🟣 ${n('VINTED')} · 🔵 ${n('SELL')} · ⚪ ${n('GOODWILL')}` : 'Today: 0 sorted';
}

function passScreen(msg){
  $('app').innerHTML = `<div class="pass"><b>Type your PIN</b><span class="hint" style="text-align:left">Your own 4-digit PIN. You only type it once on this device.</span>
    ${msg ? `<span style="color:var(--toss);font-weight:700">${esc(msg)}</span>` : ''}
    <input id="pw" type="password" autocomplete="current-password"><button class="go" id="pwgo">Start sorting</button></div>`;
  $('pw').focus();
  const go = () => { ls.set(PASS_KEY, $('pw').value.trim()); WHO = ''; binNo = 0; binN = null; ls.set(BIN_KEY, ''); try { localStorage.removeItem('pdSortWho'); } catch(e){} home(); };
  $('pwgo').onclick = go; $('pw').onkeydown = (e) => { if (e.key === 'Enter') go(); };
}

function binBarHtml(){
  if (!binNo) return `<div class="binbar"><span class="lbl">📦 Getting your bin…<small>one moment</small></span></div>`;
  const nm = WHO ? WHO.charAt(0).toUpperCase() + WHO.slice(1) : '';
  return `<div class="binbar"><span class="lbl">📦 ${nm ? esc(nm) + ' · ' : ''}Filling Bin ${binNo}<small>${binN == null ? 'counting…' : `${binN} of ${binCap} books`} · tap to change</small></span><button id="binplus" style="font-size:.95rem">🆕 New bin</button><button id="whoswitch" style="font-size:.85rem" title="Someone else sorting">👤 Switch</button></div>`;
}
// "always give me a new one so I dont overlap" - a new bin is the next number nobody has used (shared with the Book Station)
async function newBin(){
  try { const r = await api('bin_new', { who: WHO, from: binNo || null }); binNo = Number(r.bin); binN = Number(r.n) || 0; binCap = Number(r.cap) || binCap; ls.set(BIN_KEY, String(binNo)); }
  catch(e){ alert("Couldn't get a new bin number. Try again."); return; }
  const bb = document.querySelector('.binbar'); if (bb) { bb.outerHTML = binBarHtml(); wireBin(); }
  alert('Start Bin ' + binNo + '. Write ' + binNo + ' on an empty bin.');
}
function setBin(n){ binNo = Math.max(1, n); ls.set(BIN_KEY, String(binNo)); binN = null; loadBin(); }
async function loadBin(){
  if (!WHO) await askWho();
  try {
    if (!binNo) { const m = await api('bin_mine', { who: WHO }); binNo = Number(m.bin); ls.set(BIN_KEY, String(binNo)); binN = Number(m.n) || 0; binCap = Number(m.cap) || 18; }
    else { const r = await api('bin', { bin: binNo }); binN = Number(r.n) || 0; binCap = Number(r.cap) || 18; }
  } catch(e){}
  const bb = document.querySelector('.binbar'); if (bb) { bb.outerHTML = binBarHtml(); wireBin(); }
}
function wireBin(){
  const ask = async () => { const v = prompt('Which of YOUR bins are you filling? (number)', binNo || ''); const n = parseInt(v, 10); if (!(n > 0)) return;
    try { const r = await api('bin_take', { bin: n, who: WHO }); binNo = n; ls.set(BIN_KEY, String(n)); binN = Number(r.n) || 0; binCap = Number(r.cap) || binCap; const bb = document.querySelector('.binbar'); if (bb) { bb.outerHTML = binBarHtml(); wireBin(); } }
    catch(e){ alert(e.message || 'That bin is not yours.'); } };
  if ($('binset')) $('binset').onclick = ask;
  if ($('binplus')) $('binplus').onclick = newBin;
  if ($('whoswitch')) $('whoswitch').onclick = () => { ls.set(PASS_KEY, ''); passScreen('Type the PIN of the person sorting now.'); };
  const l = document.querySelector('.binbar .lbl'); if (l && binNo) { l.style.cursor = 'pointer'; l.onclick = ask; }
}
function home(note){
  cur = null;
  $('app').innerHTML = binBarHtml() + `
    <div class="scan"><input id="isbn" inputmode="numeric" autocomplete="off" placeholder="Scan the barcode" aria-label="Barcode or ISBN">
      <button class="cam" id="cam" aria-label="Take a photo">📷</button></div>
    <p class="hint">No barcode? Tap 📷 and take a photo of the cover or the copyright page.</p>
    <div id="out">${note || `<div class="legend" style="margin-top:8px">
      <span style="background:var(--list)">🟢 LIST box + sticker</span><span style="background:var(--vinted)">🟣 VINTED bag</span>
      <span style="background:var(--sell)">🔵 SELL BACK box</span><span style="background:var(--goodwill)">⚪ GOODWILL box</span>
      <span style="background:var(--ask)">🟡 ASK DAD box</span><span style="background:var(--toss)">🔴 SET ASIDE for Dad</span></div>`}</div>${recentHtml()}`;
  wireBin(); if (binN == null) loadBin();
  document.querySelectorAll('[data-fix]').forEach((b) => b.onclick = () => { const r = recent[Number(b.dataset.fix)]; cur = { pile_id: r.id }; showList(r.title, '', r.pd, r.box); });
  const inp = $('isbn'); inp.focus();
  inp.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); const v = inp.value.replace(/[^0-9Xx]/g, '').toUpperCase();
    const ok = (d) => { if (d.length === 10) { let t = 0; for (let i = 0; i < 10; i++) t += (d[i] === 'X' ? 10 : +d[i]) * (10 - i); return t % 11 === 0; }
      if (d.length === 13 && /^97[89]/.test(d)) { let t = 0; for (let i = 0; i < 13; i++) t += +d[i] * (i % 2 ? 3 : 1); return t % 10 === 0; } return true; };
    if (v.length >= 10 && !ok(v)) { $('out').innerHTML = `<div class="res RETAKE"><div class="bin">🔁 CHECK THE NUMBER</div><div class="what">That ISBN doesn't look right (${esc(v)}). Type it again carefully.</div></div>`; inp.select(); return; }
    if (v.length >= 10) check({ isbn: v }); } };
  $('cam').onclick = () => $('file').click();
}

$('file').addEventListener('change', async () => {
  const f = $('file').files[0]; $('file').value = ''; if (!f) return;
  try { check({ image: await shrink(f) }); } catch(e){ home(`<div class="res RETAKE"><div class="what">That photo didn't open. Try again.</div></div>`); }
});
function shrink(file){
  return new Promise((ok, bad) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const sc = Math.min(1, 1400 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg', 0.85).split(',')[1]); };
    img.onerror = () => { URL.revokeObjectURL(u); bad(new Error('bad photo')); };
    img.src = u;
  });
}

async function check(body){
  $('out').innerHTML = `<div class="busy"><div class="spin"></div>Checking this book…</div>`;
  let j;
  try { j = await api('check', body); }
  catch(e){
    if (e.code === 'bad_passcode') return passScreen('That PIN did not work.');
    return home(`<div class="res RETAKE"><div class="bin">🔁 TRY AGAIN</div><div class="what">${esc(e.message || 'The check did not answer.')}</div></div>`);
  }
  cur = j;
  const title = j.ident && j.ident.title ? j.ident.title : '';
  let v = String(j.verdict || '').toUpperCase();
  if (j.family) v = 'TOSS';
  if (v === 'CHECK') v = 'ASK';
  if (v === 'RETAKE') return home(`<div class="res RETAKE"><div class="bin">🔁 TRY AGAIN</div><div class="what">Couldn't tell which book this is.</div>
      <div>Scan the barcode, or take a photo of the <b>copyright page</b> (the page with the small print).</div></div>`);
  if (v === 'LIST') return showList(title);
  if (v === 'VINTED') {
    $('out').innerHTML = `<div class="busy"><div class="spin"></div>Finding its Vinted bag…</div>`;
    let bag = null; try { bag = await api('pile', { id: j.pile_id, pile: 'VINTED' }); } catch(e){}
    count('VINTED'); remember('VINTED', title);
    return home(`<div class="res VINTED"><div class="bin">🟣 VINTED</div>
      ${bag && bag.vnum ? `<div class="what">Put it in bag</div><div class="big">${esc(bag.vnum)}</div><div class="what">${esc(bag.group || '')}</div>
        ${Number(bag.n) === 1 ? `<div>🆕 New bag: write <b>${esc(bag.vnum)}</b> on painter's tape.</div>` : ''}${bag.full ? '<div><b>✅ This bag is full now.</b></div>' : ''}`
        : `<div class="what">Put it in the Vinted box.</div>`}
      <div class="title">${esc(title)}</div></div>`);
  }
  if (v === 'TOSS' || v === 'ASK') { try { if (j.pile_id) await api('pile', { id: j.pile_id, pile: 'MAYBE' }); } catch(e){} }
  const map = {
    SELL: ['🔵 SELL BACK', 'Put it in the SELL BACK box.'],
    GOODWILL: ['⚪ GOODWILL', 'Put it in the GOODWILL box.'],
    TOSS: ['🔴 SET ASIDE', j.family ? 'Not for our shop. Set it aside for Dad.' : 'Set it aside for Dad.'],
    ASK: ['🟡 ASK DAD', 'Put it in the ASK DAD box. Dad decides this one.'],
  }[v] || ['🟡 ASK DAD', 'Put it in the ASK DAD box.'];
  const binKey = map[0].includes('SELL') ? 'SELL' : map[0].includes('GOODWILL') ? 'GOODWILL' : v === 'TOSS' ? 'TOSS' : 'ASK';
  count(binKey); remember(binKey, title);
  home(`<div class="res ${v === 'SELL' || v === 'GOODWILL' || v === 'TOSS' ? v : 'ASK'}"><div class="bin">${map[0]}</div><div class="what">${esc(map[1])}</div><div class="title">${esc(title)}</div></div>`);
}

function showList(title, err, fixing, fixBox){
  const next = fixing ? String(fixing).replace(/\D/g, '') : (ls.get(STK_KEY) || '');
  $('app').innerHTML = `<div class="res LIST" style="margin-top:4px"><div class="bin">🟢 LIST</div>
    ${!fixing && binNo ? `<div class="what">Goes in</div><div class="binbig">BIN ${binNo}</div>` : ''}
    <div class="what">${fixing ? 'Fix the sticker number for this book.' : 'Put the next sticker on a tab, then type its number.'}</div><div class="title">${esc(title)}</div>
    ${err ? `<div class="err">${esc(err)}</div>` : ''}
    <div class="stk"><input id="stk" inputmode="numeric" autocomplete="off" placeholder="Sticker #" value="${esc(next)}"><button id="stkgo">Save</button></div>
    <div class="hint" style="color:#e9fff1">${fixing ? 'Type the number that is really on the sticker, then Save.' : next ? 'The next number on the roll is filled in. Just press Save if it matches.' : 'Type the number printed on the sticker.'}</div>
    <button class="skip" id="stkskip">No sticker right now - set it aside for Dad</button></div>`;
  const s = $('stk'); s.focus(); s.select();
  const save = async () => {
    const pd = s.value.trim(); if (!pd) return;
    $('stkgo').disabled = true; $('stkgo').textContent = 'Saving…';
    try {
      const box = fixing ? (fixBox || null) : (binNo || null);
      const r = await api('sticker', { id: cur.pile_id, pd, bin: fixing ? undefined : box });
      const n = Number(String(r.pd).replace(/\D/g, ''));
      if (!fixing) { if (n) ls.set(STK_KEY, String(n + 1)); count('LIST'); }
      remember('LIST', title, r.pd, box);
      let full = '';
      if (!fixing && r.bin_status) {
        binN = Number(r.bin_status.n) || 0; binCap = Number(r.bin_status.cap) || binCap;
        if (binN >= binCap) {
          const was = binNo; let nx = null;
          try { nx = await api('bin_new', { who: WHO, from: was }); } catch(e){}
          if (nx && nx.bin) { binNo = Number(nx.bin); binN = Number(nx.n) || 0; ls.set(BIN_KEY, String(binNo)); }
          full = `<div style="background:#fff3b0;color:#4a2a63;border-radius:10px;padding:8px 12px;font-weight:800">📦 Bin ${was} is full! Put the lid on. Start <b>Bin ${binNo}</b> - write ${binNo} on an empty bin.</div>`;
        }
      }
      home(`<div class="res LIST"><div class="bin">✅ ${esc(r.pd)}</div><div class="what">${box ? 'Put it in' : 'Sticker saved. Put it in the LIST box.'}</div>${box ? `<div class="binbig">BIN ${esc(box)}</div>` : ''}<div class="title">${esc(title)}</div>${full}</div>`);
    } catch(e){ showList(title, e.message || "That didn't save. Try again.", fixing); }
  };
  $('stkgo').onclick = save; s.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); save(); } };
  if (fixing) $('stkskip').style.display = 'none';
  $('stkskip').onclick = () => { count('LIST'); remember('LIST', title); home(`<div class="res LIST"><div class="bin">🟢 LIST</div><div class="what">No sticker yet. Set it aside for Dad to sticker (don't put it in a numbered bin).</div><div class="title">${esc(title)}</div></div>`); };
}

showTally();
if (!ls.get(PASS_KEY)) passScreen(); else home();
</script>
</body>
</html>
